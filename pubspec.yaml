name: medication_reminder_app
description: "MediRemind - Never miss a dose"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  provider: ^6.1.5+1
  google_fonts: ^8.2.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  pdf: ^3.13.0
  printing: ^5.15.0
  path_provider: ^2.1.6
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

# ─────────────────────────────────────────────────────────────
# NATIVE SPLASH CONFIGURATION
# After editing this, run: dart run flutter_native_splash:create
# ─────────────────────────────────────────────────────────────
flutter_native_splash:
  color: "#00897B"
  image: assets/images/splash_logo.png
  color_dark: "#121212"
  image_dark: assets/images/splash_logo.png
  android: true
  ios: true
  web: false
  fullscreen: true

  android_12:
    color: "#00897B"
    image: assets/images/splash_logo.png
    color_dark: "#121212"
    image_dark: assets/images/splash_logo.png
    icon_background_color: "#00897B"
    icon_background_color_dark: "#121212"

# ─────────────────────────────────────────────────────────────
# APP ICON CONFIGURATION
# After editing this, run: dart run flutter_launcher_icons
# ─────────────────────────────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#00897B"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  remove_alpha_ios: true